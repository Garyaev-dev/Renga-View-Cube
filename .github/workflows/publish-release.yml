name: Publish ViewCube release
on:
  push:
    branches: [release/publish-v1.5.2.0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.2.0 .release/ViewCubeOverlay-v1.5.2.0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target 3175edfee1ce2b40bd25e5073109e0bac0aa4c6b \
            --title "Видовой куб для Renga 1.5.2.0" \
            --notes-file .release/notes.md
